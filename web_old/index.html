<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Radio Station</title>
    <style>
        body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        // ========================================
        // AUDIO STREAM PLAYER
        // ========================================
        let audioElement = null;
        let currentStreamVolume = 0.5;

        function playStream(url, volume) {
            stopStream();
            if (!url || url === '') return;
            audioElement = new Audio(url);
            audioElement.volume = clamp(volume !== undefined ? volume : currentStreamVolume);
            audioElement.crossOrigin = 'anonymous';
            audioElement.addEventListener('error', function(e) {
                console.error('[radio] Stream error:', e.target.error);
                sendToLua('audioError', { error: 'Failed to load stream' });
            });
            audioElement.play().then(function() {
                console.log('[radio] Stream playing:', url);
            }).catch(function(err) {
                console.warn('[radio] Stream play failed:', err.message);
                sendToLua('audioError', { error: err.message });
            });
        }

        function stopStream() {
            if (audioElement) {
                audioElement.pause();
                audioElement.src = '';
                audioElement.load();
                audioElement = null;
            }
        }

        function setStreamVolume(vol) {
            currentStreamVolume = clamp(vol);
            if (audioElement) audioElement.volume = currentStreamVolume;
        }

        // ========================================
        // WEBRTC VOICE ENGINE
        // ========================================
        const ICE_SERVERS = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
        ];

        let localStream = null;           // getUserMedia mic stream
        let peerConnections = {};          // { peerId: RTCPeerConnection }
        let remoteAudios = {};             // { peerId: HTMLAudioElement }
        let isBroadcaster = false;
        let voiceVolume = 1.0;

        // --- BROADCASTER: capture mic ---
        async function startMicCapture() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 48000,
                    },
                    video: false,
                });
                isBroadcaster = true;
                console.log('[radio] Mic captured successfully');
                sendToLua('micCaptured', { success: true });
            } catch (err) {
                console.error('[radio] getUserMedia failed:', err.name, err.message);
                sendToLua('micCaptured', { success: false, error: err.name + ': ' + err.message });
            }
        }

        // --- BROADCASTER: stop broadcasting ---
        function stopMicCapture() {
            // Close all peer connections
            for (var pid in peerConnections) {
                closePeer(pid);
            }
            peerConnections = {};
            // Release mic
            if (localStream) {
                localStream.getTracks().forEach(function(t) { t.stop(); });
                localStream = null;
            }
            isBroadcaster = false;
            console.log('[radio] Mic released, broadcast stopped');
        }

        // --- BROADCASTER: create offer for a listener ---
        async function createOfferFor(listenerId) {
            if (!localStream) {
                console.warn('[radio] No localStream, cannot create offer');
                return;
            }
            var pc = makePeerConnection(listenerId);
            // Add mic audio tracks
            localStream.getTracks().forEach(function(track) {
                pc.addTrack(track, localStream);
            });
            try {
                var offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                sendToLua('signal', {
                    targetPeerId: listenerId,
                    type: 'offer',
                    sdp: offer.sdp,
                });
                console.log('[radio] Sent offer to', listenerId);
            } catch (err) {
                console.error('[radio] createOffer error:', err);
            }
        }

        // --- LISTENER: handle incoming offer ---
        async function handleOffer(fromId, sdp) {
            var pc = makePeerConnection(fromId);
            try {
                await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: sdp }));
                var answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                sendToLua('signal', {
                    targetPeerId: fromId,
                    type: 'answer',
                    sdp: answer.sdp,
                });
                console.log('[radio] Sent answer to', fromId);
            } catch (err) {
                console.error('[radio] handleOffer error:', err);
            }
        }

        // --- BROADCASTER: handle answer from listener ---
        async function handleAnswer(fromId, sdp) {
            var pc = peerConnections[fromId];
            if (!pc) return;
            try {
                await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: sdp }));
                console.log('[radio] Set answer from', fromId);
            } catch (err) {
                console.error('[radio] handleAnswer error:', err);
            }
        }

        // --- Handle ICE candidate ---
        async function handleIce(fromId, candidate) {
            var pc = peerConnections[fromId];
            if (!pc) return;
            try {
                await pc.addIceCandidate(new RTCIceCandidate(candidate));
            } catch (err) {
                console.error('[radio] addIceCandidate error:', err);
            }
        }

        // --- Create RTCPeerConnection with handlers ---
        function makePeerConnection(peerId) {
            if (peerConnections[peerId]) closePeer(peerId);

            var pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

            // Send ICE candidates to the other peer
            pc.onicecandidate = function(ev) {
                if (ev.candidate) {
                    sendToLua('signal', {
                        targetPeerId: peerId,
                        type: 'ice',
                        candidate: {
                            candidate: ev.candidate.candidate,
                            sdpMid: ev.candidate.sdpMid,
                            sdpMLineIndex: ev.candidate.sdpMLineIndex,
                        },
                    });
                }
            };

            // When we receive remote audio (listener side)
            pc.ontrack = function(ev) {
                console.log('[radio] Got remote audio from', peerId);
                var audio = remoteAudios[peerId];
                if (!audio) {
                    audio = new Audio();
                    audio.autoplay = true;
                    audio.volume = clamp(voiceVolume);
                    remoteAudios[peerId] = audio;
                }
                audio.srcObject = ev.streams[0];
                audio.play().catch(function(e) {
                    console.warn('[radio] Remote audio play error:', e.message);
                });
                sendToLua('voiceConnected', { peerId: peerId });
            };

            pc.oniceconnectionstatechange = function() {
                console.log('[radio] ICE state', peerId, ':', pc.iceConnectionState);
                if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
                    closePeer(peerId);
                }
            };

            peerConnections[peerId] = pc;
            return pc;
        }

        // --- Close a single peer ---
        function closePeer(peerId) {
            var pc = peerConnections[peerId];
            if (pc) { pc.close(); delete peerConnections[peerId]; }
            var audio = remoteAudios[peerId];
            if (audio) { audio.pause(); audio.srcObject = null; delete remoteAudios[peerId]; }
        }

        // --- Close everything ---
        function closeAllPeers() {
            for (var pid in peerConnections) closePeer(pid);
            stopMicCapture();
        }

        function setVoiceVolume(vol) {
            voiceVolume = clamp(vol);
            for (var pid in remoteAudios) {
                remoteAudios[pid].volume = voiceVolume;
            }
        }

        // ========================================
        // NUI COMMUNICATION
        // ========================================
        function sendToLua(event, data) {
            fetch('https://' + GetParentResourceName() + '/' + event, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data || {}),
            }).catch(function() {});
        }

        function clamp(v) { return Math.min(1.0, Math.max(0.0, v)); }

        // ========================================
        // MESSAGE HANDLER (from Lua SendNUIMessage)
        // ========================================
        window.addEventListener('message', function(event) {
            var d = event.data;
            if (!d || !d.action) return;

            switch (d.action) {
                // --- Audio stream ---
                case 'playStream':     playStream(d.url, d.volume); break;
                case 'stopStream':     stopStream(); break;
                case 'setVolume':      setStreamVolume(d.volume); break;

                // --- WebRTC broadcaster ---
                case 'startMic':       startMicCapture(); break;
                case 'stopMic':        stopMicCapture(); break;
                case 'createOffer':    createOfferFor(d.listenerId); break;

                // --- WebRTC signaling ---
                case 'signal':
                    if (d.signalType === 'offer')       handleOffer(d.fromPeerId, d.sdp);
                    else if (d.signalType === 'answer')  handleAnswer(d.fromPeerId, d.sdp);
                    else if (d.signalType === 'ice')     handleIce(d.fromPeerId, d.candidate);
                    break;

                // --- WebRTC cleanup ---
                case 'closePeer':      closePeer(d.peerId); break;
                case 'closeAll':       closeAllPeers(); break;

                // --- Voice volume ---
                case 'setVoiceVolume': setVoiceVolume(d.volume); break;
            }
        });
    </script>
</body>
</html>
